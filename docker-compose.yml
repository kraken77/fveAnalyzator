# VÝVOJOVÁ instance (tento soubor) — web :3100, API :8052.
#   docker compose up -d --build
#
# PRODUKČNÍ instance je samostatný compose projekt (docker-compose.prod.yml) —
# web :3001, API :8051, veřejně na https://fve.etikos.cz (cesta přes .20).
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8052:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RG_JWT_SECRET=${RG_JWT_SECRET:-dev-secret-change-me-in-prod}
      - RG_ADMIN_EMAIL=${RG_ADMIN_EMAIL:-admin@antelon.local}
      - RG_ADMIN_PASSWORD=${RG_ADMIN_PASSWORD:-admin123}
      - RG_ANTELON_EMAIL=${RG_ANTELON_EMAIL:-antelon@antelon.local}
      - RG_ANTELON_PASSWORD=${RG_ANTELON_PASSWORD:-Antelon123!}
      - RG_CUSTOMER_EMAIL=${RG_CUSTOMER_EMAIL:-zakaznik@antelon.local}
      - RG_CUSTOMER_PASSWORD=${RG_CUSTOMER_PASSWORD:-Zakaznik123!}
      # Sdílené odkazy/QR ve vývoji — produkce si drží vlastní hodnotu
      # (https://fve.etikos.cz) v docker-compose.prod.yml.
      - RG_PUBLIC_URL=${RG_PUBLIC_URL:-http://localhost:3100}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    ports:
      # Vývojová instance. Port 3001 patří produkci (docker-compose.prod.yml).
      - "3100:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api/v1
