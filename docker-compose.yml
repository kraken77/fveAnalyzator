services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8051:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RG_JWT_SECRET=${RG_JWT_SECRET:-dev-secret-change-me-in-prod}
      - RG_ADMIN_EMAIL=${RG_ADMIN_EMAIL:-admin@antelon.local}
      - RG_ADMIN_PASSWORD=${RG_ADMIN_PASSWORD:-admin123}
      - RG_PUBLIC_URL=${RG_PUBLIC_URL:-http://localhost:3000}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api/v1

  frontend-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8550:8501" # Changed host port to avoid conflict
    volumes:
      - ./frontend-streamlit:/app # Mount the Streamlit app directory
      - ./backend:/backend_app # Mount the backend app as well to allow imports if needed
      - ./settings:/app/settings # Mount the settings directory
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8000 # Point to the backend service within the Docker network
    working_dir: /app
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
