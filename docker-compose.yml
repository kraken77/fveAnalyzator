services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8051:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RG_JWT_SECRET=${RG_JWT_SECRET:-dev-secret-change-me-in-prod}
      - RG_ADMIN_EMAIL=${RG_ADMIN_EMAIL:-admin@antelon.local}
      - RG_ADMIN_PASSWORD=${RG_ADMIN_PASSWORD:-admin123}
      - RG_ANTELON_EMAIL=${RG_ANTELON_EMAIL:-antelon@antelon.local}
      - RG_ANTELON_PASSWORD=${RG_ANTELON_PASSWORD:-Antelon123!}
      - RG_CUSTOMER_EMAIL=${RG_CUSTOMER_EMAIL:-zakaznik@antelon.local}
      - RG_CUSTOMER_PASSWORD=${RG_CUSTOMER_PASSWORD:-Zakaznik123!}
      - RG_PUBLIC_URL=${RG_PUBLIC_URL:-http://localhost:${WEB_PORT:-3000}}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    ports:
      # WEB_PORT = adresa pro lokální vývoj (default 3000, viz .env.example).
      # 3001 je natvrdo proto, že na něj míří reverse proxy v etikos-nginx
      # (server_name fve.etikos.cz -> proxy_pass http://<drakisa>:3001)
      # a taky deploy.sh healthcheck (WEB_PORT="${WEB_PORT:-3001}").
      - "${WEB_PORT:-3000}:80"
      - "3001:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api/v1
